[workspace]
members = [".", "macro"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vi-is-ramen/genum"

[package]
name = "genum"
description = "Compile-time verified enum narrowing with zero-cost conversions and niche optimizations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["enum", "macro", "proc-macro", "discriminant", "grouping"]
categories = ["rust-patterns", "no-std", "data-structures"]
include = [
    "src/**/*.rs",
    "Cargo.toml",
    "README.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
    "NOTICE",
]

[dependencies]
genum-macro = { path = "./macro", version = "=0.1.0" }

[dev-dependencies]
trybuild = "1.0"
